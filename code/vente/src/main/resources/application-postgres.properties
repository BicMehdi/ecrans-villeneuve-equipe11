spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecrans_villeneuve}
spring.datasource.username=${DB_USER:ecrans}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schéma est conservé entre les redémarrages. En production, une migration
# versionnée (Flyway/Liquibase) remplacera "update" avant la mise en service.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
