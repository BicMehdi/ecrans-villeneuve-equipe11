services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecrans_villeneuve
      POSTGRES_USER: ecrans
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecrans-local}
    ports:
      - "5432:5432"
    volumes:
      - ecrans_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecrans -d ecrans_villeneuve"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ecrans_postgres_data:
